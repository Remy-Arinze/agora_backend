# Production Docker Compose
# Usage:
#   1. Copy .env.prod.example to .env.prod and fill in all values
#   2. docker compose -f docker-compose.prod.yml up -d
#
# Architecture (Coolify deployment):
#   Coolify's built-in reverse proxy handles SSL/TLS and domain routing.
#   api    → NestJS app (port 4000, managed by Coolify proxy)
#   db     → PostgreSQL 16 (internal only — use Coolify's DB service instead)
#   redis  → Redis 7 with password (internal only — use Coolify's Redis service instead)
#   alloy  → Grafana Alloy metrics agent (internal only)
#
# NOTE: When deploying via Coolify, create Postgres and Redis as separate Coolify
# services and pass their connection strings as environment variables (DB_URL, REDIS_URL).
# The db and redis services below are only needed for raw VPS deployments without Coolify.

networks:
  agora_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:

  # ─── NestJS API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Coolify's built-in reverse proxy handles SSL and routing — expose port directly
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_URL: ${DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS: "false"
      REDIS_IS_CLUSTER: "false"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      Azure_OPENAI_EMBEDDING_ENDPOINT: ${Azure_OPENAI_EMBEDDING_ENDPOINT}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}
      AZURE_OPENAI_EMBEDDING_API_VERSION: ${AZURE_OPENAI_EMBEDDING_API_VERSION}
      AZURE_OPENAI_EMBEDDING_API_KEY: ${AZURE_OPENAI_EMBEDDING_API_KEY}
      AGORA_CREDITS_PER_1M_TOKENS: ${AGORA_CREDITS_PER_1M_TOKENS:-1000}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET}
      PAYMENT_WEBHOOK_ALLOWED_IPS: ${PAYMENT_WEBHOOK_ALLOWED_IPS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      METRICS_API_KEY: ${METRICS_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      STUDENT_UID_SUFFIX_LENGTH: ${STUDENT_UID_SUFFIX_LENGTH:-6}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agora_net

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # No ports: block — not reachable from outside the VPS
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agora_net

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No ports: block — not reachable from outside the VPS
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agora_net

  # ─── Grafana Alloy (metrics agent) ──────────────────────────────────────────
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/alloy.config:/etc/alloy/config.alloy:ro
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    environment:
      METRICS_API_KEY: ${METRICS_API_KEY}
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER}
      GRAFANA_CLOUD_PROMETHEUS_TOKEN: ${GRAFANA_CLOUD_PROMETHEUS_TOKEN}
    depends_on:
      - api
    networks:
      - agora_net
